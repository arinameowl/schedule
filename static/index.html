<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#14201c);--mut:var(--tg-theme-hint-color,#74807b);
--sec:var(--tg-theme-secondary-bg-color,#eef2f0);--btn:var(--tg-theme-button-color,#1f7a5c);--btnfg:var(--tg-theme-button-text-color,#fff)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:env(safe-area-inset-bottom)}
nav{display:flex;position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--sec)}
nav button{flex:1;padding:12px 4px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mut);font:inherit}
nav button.on{color:var(--fg);border-color:var(--btn);font-weight:600}
main{padding:12px}
h3{margin:20px 0 8px}
.hint{color:var(--mut);font-size:13px}
.d{padding:4px 6px;border:0;border-radius:6px;background:var(--sec);color:var(--fg);font:inherit;font-size:12px}
.wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%}
th{font-weight:500;color:var(--mut);font-size:12px;padding:4px 2px;white-space:nowrap}
td{padding:0 1px}
.c{display:block;width:100%;min-width:34px;height:30px;margin:1px 0;border:0;border-radius:6px;background:var(--sec)}
.c.on{background:var(--btn)}
.c:disabled{opacity:.45}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid var(--sec);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.btn,.btn2{padding:10px 14px;margin:8px 0 0;border:0;border-radius:8px;font:inherit;background:var(--btn);color:var(--btnfg)}
.btn2{background:var(--sec);color:var(--fg)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{padding:10px 12px;margin-bottom:8px;border-radius:10px;background:var(--sec)}
dialog{width:min(92vw,360px);padding:16px;border:0;border-radius:14px;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin-top:0}
</style>
</head>
<body>
<nav></nav><main></main><dialog id="dlg"></dialog>
<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = s => document.querySelector(s), main = $("main"), nav = $("nav"), dlg = $("#dlg");
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"], HOURS = [...Array(15)].map((_, i) => i + 8);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toLocaleDateString("sv", {timeZone:"Europe/Moscow"});
const hh = h => String(h).padStart(2, "0") + ":00";
const when = s => WD[(new Date(s.slice(0,10) + "T12:00").getDay() + 6) % 7] + " " + s.slice(8,10) + "." + s.slice(5,7) + " " + s.slice(11,16);
const toast = m => tg.showAlert(m);
const ok = () => tg.HapticFeedback.notificationOccurred("success");
const closeAsk = () => dlg.close();
let me;

async function api(path, method = "GET", body) {
  const r = await fetch("/api" + path, {method, headers: {"X-Init-Data": tg.initData, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Что-то пошло не так");
  return d;
}
const safe = f => (...a) => f(...a).catch(e => toast(e.message));

function ask(html, label, fn) {
  dlg.innerHTML = `<form method="dialog">${html}<div class="row"><button class="btn2" value="x">Отмена</button><button class="btn" id="go" type="button">${label}</button></div></form>`;
  $("#go").onclick = safe(fn); dlg.showModal();
}

let draft = null;
const FULL = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const opts = (a, b, sel) => { let s = ""; for (let h = a; h <= b; h++) s += `<option value="${h}"${h === sel ? " selected" : ""}>${hh(h)}</option>`; return s; };
const rng = hs => { const out = []; for (const h of hs) { const l = out[out.length - 1]; if (l && l[1] === h) l[1]++; else out.push([h, h + 1]); } return out; };
const gridSet = () => new Set([...main.querySelectorAll(".c.on")].map(b => b.dataset.k));
const setDay = (w, fn) => main.querySelectorAll(`.c[data-k^="${w}:"]`).forEach(b => b.classList.toggle("on", fn(+b.dataset.k.split(":")[1])));

function dayRange(w) {
  ask(`<h3>${FULL[w]}</h3><div class="row"><select id="rf" style="flex:1">${opts(8, 22, 13)}</select><select id="rt" style="flex:1">${opts(9, 23, 19)}</select></div>
    <button class="btn2" type="button" id="clr">Очистить день</button>`, "Применить", async () => {
    const f = +$("#rf").value, t = +$("#rt").value;
    if (t <= f) return toast("Конец должен быть позже начала");
    setDay(w, h => h >= f && h < t); closeAsk();
  });
  $("#clr").onclick = () => { setDay(w, () => false); closeAsk(); };
}

async function windows() {
  const a = await api("/availability"), on = draft || new Set(a.slots.map(s => s.join(":")));
  const upcoming = await api("/bookings");
  const byDay = {}; a.blocks.forEach(b => (byDay[b.day] ||= []).push(b.hour));
  const again = () => { draft = gridSet(); windows(); };
  const del = (attrs, label) => `<div class="card row">${label}<button class="btn2" style="margin:0 0 0 auto" ${attrs}>Убрать</button></div>`;
  main.innerHTML = `<p class="hint">Основное расписание ведется по Москве (МСК). Ваше локальное время: <b id="localnow">загрузка…</b>. Время в сетке ниже указано по Москве.</p>
  <h3>Ваш часовой пояс</h3><input id="timezone" list="tzlist" placeholder="Например, Europe/Amsterdam"><datalist id="tzlist"><option value="Europe/Moscow">Москва</option><option value="Europe/Kaliningrad">Калининград</option><option value="Europe/Istanbul">Стамбул</option><option value="Europe/Berlin">Берлин</option><option value="Europe/Amsterdam">Амстердам</option><option value="Europe/Paris">Париж</option><option value="Europe/Stockholm">Стокгольм</option><option value="Europe/Helsinki">Хельсинки</option><option value="Europe/London">Лондон</option><option value="Asia/Almaty">Алматы</option><option value="Asia/Tbilisi">Тбилиси</option><option value="Asia/Dubai">Дубай</option><option value="Asia/Bangkok">Бангкок</option><option value="Asia/Tokyo">Токио</option><option value="Asia/Novosibirsk">Новосибирск</option><option value="Asia/Yekaterinburg">Екатеринбург</option><option value="UTC">UTC</option><option value="America/New_York">Нью-Йорк</option><option value="America/Los_Angeles">Лос-Анджелес</option></datalist>
  <button class="btn2" id="savetz">Сохранить часовой пояс</button>
  <p class="hint">Нажмите на день недели, чтобы задать часы диапазоном (например, 13:00–19:00), или отметьте часы вручную. Они повторяются каждую неделю.</p>
  <table><tr><th></th>${WD.map((d, w) => `<th><button class="d" data-w="${w}">${d}</button></th>`).join("")}</tr>
  ${HOURS.map(h => `<tr><th>${h}</th>${WD.map((_, w) => `<td><button class="c${on.has(w + ":" + h) ? " on" : ""}" data-k="${w}:${h}"></button></td>`).join("")}</tr>`).join("")}</table>
  <button class="btn" id="save">Сохранить окна</button>
  <h3>Закрыть время на дату</h3>
  <input type="date" id="off" min="${today()}">
  <div class="row"><select id="bf" style="flex:1">${opts(8, 22, 10)}</select><select id="bt" style="flex:1">${opts(9, 23, 12)}</select></div>
  <div class="row"><button class="btn" id="addblk">Закрыть часы</button><button class="btn2" id="addoff">Закрыть весь день</button></div>
  <div style="margin-top:12px">${a.days_off.map(d => del(`data-d="${d}"`, `${d}, весь день`)).join("")}
  ${Object.entries(byDay).flatMap(([d, hs]) => rng(hs).map(([f, t]) => del(`data-bd="${d}" data-bf="${f}" data-bt="${t}"`, `${d}, ${hh(f)}–${hh(t)}`))).join("")}</div>
  <h3>Занятые окна — ближайшие уроки</h3>
  <p class="hint">Эти часы уже заняты и не доступны для новой записи. Время указано по Москве и в вашем часовом поясе.</p>
  <div>${upcoming.length ? upcoming.slice(0,30).map(b => `<div class="card"><b>${when(b.start)} МСК</b><br>${esc(b.student)}<br><span class="hint">Ваше время: ${esc(b.local_start || when(b.start))}</span></div>`).join("") : `<p class="hint">Ближайших уроков пока нет.</p>`}</div>`;
  $("#timezone").value = a.timezone || "Europe/Moscow";
  try { $("#localnow").textContent = new Intl.DateTimeFormat("ru-RU", {timeZone:a.timezone || "Europe/Moscow", dateStyle:"short", timeStyle:"short"}).format(new Date()); } catch {}
  $("#savetz").onclick = safe(async () => { await api("/timezone", "PUT", {timezone:$("#timezone").value}); ok(); toast("Часовой пояс сохранен"); windows(); });
  main.querySelectorAll(".c").forEach(b => b.onclick = () => b.classList.toggle("on"));
  main.querySelectorAll(".d").forEach(b => b.onclick = () => dayRange(+b.dataset.w));
  $("#save").onclick = safe(async () => {
    await api("/availability", "PUT", {slots: [...gridSet()].map(k => k.split(":").map(Number))});
    draft = null; ok(); toast("Окна сохранены");
  });
  $("#addblk").onclick = safe(async () => {
    if (!$("#off").value) return toast("Выберите дату");
    await api("/blocks", "POST", {day: $("#off").value, from_hour: +$("#bf").value, to_hour: +$("#bt").value}); ok(); again();
  });
  $("#addoff").onclick = safe(async () => {
    if (!$("#off").value) return toast("Выберите дату");
    await api("/days_off", "POST", {day: $("#off").value}); ok(); again();
  });
  main.querySelectorAll("[data-d]").forEach(b => b.onclick = safe(async () => { await api("/days_off/" + b.dataset.d, "DELETE"); again(); }));
  main.querySelectorAll("[data-bd]").forEach(b => b.onclick = safe(async () => {
    await api(`/blocks?day=${b.dataset.bd}&from_hour=${b.dataset.bf}&to_hour=${b.dataset.bt}`, "DELETE"); again();
  }));
}

async function lessons() {
  const list = await api("/bookings"), mgr = me.role !== "teacher";
  main.innerHTML = (mgr ? `<button class="btn" id="repeat">Создать регулярные уроки</button>` : "") + (list.length ? list.map(b => `<div class="card"><b>${when(b.start)} МСК</b>${!mgr && b.local_start ? `<br><span class="hint">Ваше время: ${esc(b.local_start)}</span>` : ""}<br>Ученик: ${esc(b.student)}
    ${mgr ? `<br>Преподаватель: ${esc(b.teacher)}` : ""}${b.note ? `<br><span class="hint">${esc(b.note)}</span>` : ""}
    ${mgr ? `<div class="hint">${b.confirmed ? "Преподаватель подтвердил" : "Ждём подтверждения преподавателя"}</div>
    <div class="row"><button class="btn" ${b.synced ? "disabled" : ""} data-a="sync" data-i="${b.id}">${b.synced ? "Внесено в langlisto" : "Внесено в langlisto?"}</button>
    <button class="btn2" data-a="move" data-i="${b.id}" data-t="${b.teacher_id}">Перенести</button>
    <button class="btn2" data-a="cancel" data-i="${b.id}">Отменить</button></div>` : ""}</div>`).join("")
    : `<p class="hint">Ближайших уроков нет.</p>`);
  if (mgr) $("#repeat").onclick = safe(() => recurringForm());
  main.querySelectorAll("[data-a]").forEach(b => b.onclick = safe(async () => {
    const id = b.dataset.i, a = b.dataset.a;
    if (a === "sync") { await api(`/bookings/${id}/synced`, "POST"); lessons(); }
    if (a === "move") move(id, +b.dataset.t);
    if (a === "cancel") tg.showConfirm("Отменить урок? Преподаватель получит уведомление.", safe(async yes => { if (yes) { await api(`/bookings/${id}/cancel`, "POST"); lessons(); } }));
  }));
}

async function recurringForm() {
  const teachers = await api("/free?day=" + today());
  ask(`<h3>Регулярные уроки</h3>
    <label>Преподаватель</label><select id="rtid">${teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>
    <label>Ученик</label><input id="rstudent" placeholder="Имя ученика">
    <label>Дни недели</label><div class="row">${WD.map((d,w)=>`<label style="display:flex;align-items:center;gap:4px;width:auto"><input type="checkbox" class="rwd" value="${w}" style="width:auto;margin:4px 0">${d}</label>`).join("")}</div>
    <label>Время по Москве</label><select id="rhour">${opts(8,21,17)}</select>
    <label>Первая дата</label><input type="date" id="rdate" value="${today()}" min="${today()}">
    <label>Количество недель (до 16)</label><select id="rweeks">${[4,6,8,10,12,16].map(n=>`<option value="${n}"${n===8?" selected":""}>${n} недель</option>`).join("")}</select>
    <label>Заметка</label><input id="rnote" placeholder="Необязательно">`, "Создать расписание", async () => {
      const weekdays = [...dlg.querySelectorAll(".rwd:checked")].map(x=>+x.value);
      if (!weekdays.length) return toast("Выберите хотя бы один день недели");
      const result = await api("/recurring-bookings", "POST", {teacher_id:+$("#rtid").value, student:$("#rstudent").value.trim(), weekdays, hour:+$("#rhour").value, start_day:$("#rdate").value, weeks:+$("#rweeks").value, note:$("#rnote").value.trim()});
      closeAsk();
      toast(`Создано занятий: ${result.created.length}. Конфликтов: ${result.conflicts.length}.`);
      lessons();
    });
}

async function free(day = today()) {
  const ts = await api("/free?day=" + day);
  main.innerHTML = `<input type="date" id="day" value="${day}" min="${today()}">
  <p class="hint">Закрашено: преподаватель свободен. Нажмите на ячейку, чтобы записать ученика.</p>
  <div class="wrap"><table><tr><th></th>${ts.map(t => `<th>${esc(t.name.split(" ")[0])}</th>`).join("")}</tr>
  ${HOURS.map(h => `<tr><th>${h}</th>${ts.map(t => { const f = t.hours.includes(h); return `<td><button class="c${f ? " on" : ""}" ${f ? "" : "disabled"} data-t="${t.id}" data-h="${h}"></button></td>`; }).join("")}</tr>`).join("")}</table></div>`;
  $("#day").onchange = safe(e => free(e.target.value));
  main.querySelectorAll(".c.on").forEach(b => b.onclick = () => book(day, +b.dataset.t, +b.dataset.h, ts));
}

function book(day, t, h, ts) {
  ask(`<h3>${esc(ts.find(x => x.id === t).name)}</h3><p>${day}, ${hh(h)}</p>
    <input id="st" placeholder="Ученик"><input id="nt" placeholder="Заметка для преподавателя">`, "Записать", async () => {
    const student = $("#st").value.trim(); if (!student) return toast("Укажите ученика");
    await api("/bookings", "POST", {teacher_id: t, start: `${day}T${hh(h)}`, student, note: $("#nt").value.trim()});
    closeAsk(); ok(); free(day);
  });
}

function move(id, t) {
  ask(`<h3>Новое время</h3><input type="date" id="md" value="${today()}" min="${today()}"><select id="mh"></select>`, "Перенести", async () => {
    const h = $("#mh").value; if (!h) return toast("Нет свободного времени в этот день");
    await api(`/bookings/${id}/move`, "POST", {start: `${$("#md").value}T${hh(+h)}`});
    closeAsk(); ok(); lessons();
  });
  const load = safe(async () => {
    const r = (await api("/free?day=" + $("#md").value)).find(x => x.id === t);
    $("#mh").innerHTML = r.hours.length ? r.hours.map(h => `<option value="${h}">${hh(h)}</option>`).join("") : `<option value="">Нет свободных окон</option>`;
  });
  $("#md").onchange = load; load();
}

(async () => {
  try { me = await api("/me"); } catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; return; }
  const tabs = me.role === "teacher" ? {"Окна": windows, "Уроки": lessons} : {"Свободно": free, "Записи": lessons};
  Object.entries(tabs).forEach(([name, fn], i) => {
    const b = document.createElement("button"); b.textContent = name;
    b.onclick = safe(async () => { nav.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); draft = null; await fn(); });
    nav.append(b); if (!i) b.click();
  });
})();
</script>
</body>
</html>
